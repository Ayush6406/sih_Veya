<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 52" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800&amp;display=swap');
      .veya-wordmark {
        font-family: 'Montserrat', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 800;
        font-size: 34px;
        fill: #044023;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- VEYA Brand Mark: 3-Leaf Organic Sprout -->
  <g fill="#00843D">
    <!-- Top Leaf (Smooth rounded seed cap) -->
    <path d="M 33.5 9 C 39.5 8.5 46.5 11.2 46.5 16 C 46.5 20.8 40.5 22.8 34.5 22.2 C 28.5 21.6 24.8 18.5 25 14.2 C 25.2 10.5 28.5 9.4 33.5 9 Z" />
    
    <!-- Left Leaf (Broad organic downward petal) -->
    <path d="M 23.2 21.5 C 17.5 23 13.2 27.8 13 33.8 C 12.8 39.5 16.8 43.8 22.2 44 C 26.5 44.2 28.2 40.5 28 35.5 C 27.8 30.5 26.8 24.5 23.2 21.5 Z" />
    
    <!-- Right Leaf (Upward curving cotyledon) -->
    <path d="M 30.5 26.5 C 31 32 30.2 38.5 26.8 43.2 C 31.8 44 38.2 41 42.5 36.5 C 46.5 32 45.8 26.2 39.8 25 C 36 24.2 31.5 24.8 30.5 26.5 Z" />
  </g>

  <!-- VEYA Wordmark rendered in typography font -->
  <text x="64" y="38" class="veya-wordmark">VEYA</text>
</svg>
